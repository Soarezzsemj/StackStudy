# Backup semanal do banco (Neon) com pg_dump, criptografado com GPG e guardado como artifact.
# O repositório PRECISA ser privado. Restauração: ver DEPLOY.md ("Backup e restore").
name: DB backup

on:
  schedule:
    # Todo domingo às 06:00 UTC (03:00 em Brasília).
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

env:
  # Versão do cliente; precisa ser >= a versão do Postgres no Neon (Settings > General).
  PG_MAJOR: '17'
  # Dias que o artifact fica guardado (máx. 90 em repositório privado do plano free).
  RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS || '30' }}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Conferir secrets
        env:
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DATABASE_DIRECT_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Defina os secrets DATABASE_DIRECT_URL e BACKUP_PASSPHRASE."
            exit 1
          fi
          case "$DATABASE_DIRECT_URL" in
            jdbc:*) echo "::error::Use a URL no formato postgresql:// (não JDBC)."; exit 1 ;;
            *-pooler.*) echo "::warning::Parece a URL pooled; use a URL direta do Neon." ;;
          esac

      - name: Instalar cliente PostgreSQL ${{ env.PG_MAJOR }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q "postgresql-client-${PG_MAJOR}"
          echo "/usr/lib/postgresql/${PG_MAJOR}/bin" >> "$GITHUB_PATH"

      - name: Conferir versão do servidor
        env:
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
        run: |
          server=$(psql "$DATABASE_DIRECT_URL" -tAc "show server_version_num")
          server_major=$((server / 10000))
          echo "Servidor: PostgreSQL ${server_major} | cliente: ${PG_MAJOR}"
          if [ "$server_major" -gt "$PG_MAJOR" ]; then
            echo "::error::Servidor é ${server_major}; ajuste PG_MAJOR neste workflow."
            exit 1
          fi

      - name: Gerar dump e criptografar
        env:
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
          mkdir -p backup
          pg_dump "$DATABASE_DIRECT_URL" --format=custom --no-owner --no-privileges \
            --file "backup/stackstudy-$stamp.dump"
          # Confere se o arquivo é um dump válido antes de criptografar.
          pg_restore --list "backup/stackstudy-$stamp.dump" > /dev/null
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output "backup/stackstudy-$stamp.dump.gpg" "backup/stackstudy-$stamp.dump"
          # O dump sem criptografia não sai do runner.
          shred -u "backup/stackstudy-$stamp.dump"
          (cd backup && sha256sum "stackstudy-$stamp.dump.gpg" > "stackstudy-$stamp.dump.gpg.sha256")
          ls -lh backup

      - name: Enviar artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.STAMP }}
          path: backup/
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error
          compression-level: 0
