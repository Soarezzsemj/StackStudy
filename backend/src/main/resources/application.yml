spring:
  application:
    name: stackstudy
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stackstudy}
    username: ${DB_USERNAME:stackstudy}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Liveness: só "o processo está vivo". Não consulta o banco, então pode ser pingado
        # à vontade (Render health check, UptimeRobot) sem acordar o Neon.
        liveness:
          include: livenessState
        # Readiness: pronto para atender, incluindo o banco.
        readiness:
          include: readinessState,db

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs

stackstudy:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: stackstudy
      access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
      refresh-token-ttl: ${JWT_REFRESH_TTL:P14D}
    refresh-cookie:
      name: ss_refresh
      path: /api/auth
      secure: ${REFRESH_COOKIE_SECURE:false}
      same-site: ${REFRESH_COOKIE_SAME_SITE:Strict}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    # Limites em memória (por instância). Valores pensados para uma pessoa real nunca bater
    # neles: o refresh roda a cada 15 min por aba; login/cadastro são raros.
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      login:
        limit: 10
        window: PT1M
      register:
        limit: 5
        window: PT10M
      refresh:
        limit: 30
        window: PT1M
      # Senha errada no mesmo e-mail: depois de 10 em 15 min, o e-mail fica bloqueado até a janela
      # passar (mesmo vindo de IPs diferentes).
      login-failures:
        limit: 10
        window: PT15M
      # Senha atual errada em /api/me (trocar e-mail/senha, excluir conta), por usuário.
      password-failures:
        limit: 5
        window: PT15M
