spring:
  application:
    name: stackstudy
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stackstudy}
    username: ${DB_USERNAME:stackstudy}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Foto de perfil (PROFILE_PHOTO_ENABLED): até 2 MB.
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Liveness: só "o processo está vivo". Não consulta o banco, então pode ser pingado
        # à vontade (Render health check, UptimeRobot) sem acordar o Neon.
        liveness:
          include: livenessState
        # Readiness: pronto para atender, incluindo o banco.
        readiness:
          include: readinessState,db

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs

stackstudy:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: stackstudy
      access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
      refresh-token-ttl: ${JWT_REFRESH_TTL:P14D}
    refresh-cookie:
      name: ss_refresh
      path: /api/auth
      secure: ${REFRESH_COOKIE_SECURE:false}
      same-site: ${REFRESH_COOKIE_SAME_SITE:Strict}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    # Limites em memória (por instância). Valores pensados para uma pessoa real nunca bater
    # neles: o refresh roda a cada 15 min por aba; login/cadastro são raros.
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      login:
        limit: 10
        window: PT1M
      register:
        limit: 5
        window: PT10M
      refresh:
        limit: 30
        window: PT1M
      # Senha errada no mesmo e-mail: depois de 10 em 15 min, o e-mail fica bloqueado até a janela
      # passar (mesmo vindo de IPs diferentes).
      login-failures:
        limit: 10
        window: PT15M
      # Senha atual errada em /api/me (trocar e-mail/senha, excluir conta), por usuário.
      password-failures:
        limit: 5
        window: PT15M
      # Painel do admin (/api/admin/**), por IP: o painel faz 4 chamadas por minuto.
      admin:
        limit: 60
        window: PT1M
  # Painel de status (Fase 8). ADMIN_EMAILS: contas JÁ EXISTENTES que viram ADMIN ao iniciar.
  admin:
    emails: ${ADMIN_EMAILS:}
    # O Render injeta RENDER_GIT_COMMIT; fora dele, APP_COMMIT (opcional).
    commit: ${RENDER_GIT_COMMIT:${APP_COMMIT:}}
    links:
      render: ${ADMIN_LINK_RENDER:}
      neon: ${ADMIN_LINK_NEON:}
      vercel: ${ADMIN_LINK_VERCEL:}
      backup: ${ADMIN_LINK_BACKUP:}
  # Roadmaps (Fase 9). false = lançamento: tudo grátis, mesmo o marcado como PREMIUM.
  roadmaps:
    premium-enabled: ${ROADMAPS_PREMIUM_ENABLED:false}
    # Sugestões de roadmap por usuário.
    suggestions:
      limit: 5
      window: P1D
    # Sugestão de roadmap no cadastro (GET /api/roadmaps/suggest, público), por IP.
    suggest:
      limit: 30
      window: PT1M
  # Salas de estudo (Fase 10). Presença em memória; heartbeats não tocam no banco.
  rooms:
    max-owned-rooms: 5
    max-memberships: 10
    timing:
      # Maior intervalo entre heartbeats que ainda conta (o app manda a cada 30 s).
      max-credit: PT2M
      # Sem heartbeat há mais que isso: "ausente" (o tempo para de contar).
      absent-after: PT2M
      # Sem heartbeat há mais que isso: encerrada por TIMEOUT (na próxima leitura, sem job).
      timeout-after: PT15M
      # Grava o progresso no banco a cada 30 min de sessão (e ao pausar/parar).
      save-every: PT30M
      # Tempo corrido: "Ainda está estudando?" a cada 60 min; 5 min para responder.
      confirm-every: PT60M
      confirm-grace: PT5M
    limits:
      create:
        limit: 5
        window: PT1H
      join:
        limit: 10
        window: PT10M
      report:
        limit: 5
        window: P1D
      # Reações: por remetente e, à parte, por par remetente → destinatário.
      reaction:
        limit: 30
        window: PT1H
      reaction-pair:
        limit: 1
        window: PT10S
  # Cadastro em 3 passos (Fase 11). Versões aceitas ficam no usuário (novo aceite no futuro).
  signup:
    # Versões dos textos em frontend/src/content/legal (mude junto com o arquivo .md).
    terms-version: ${TERMS_VERSION:1.0}
    privacy-version: ${PRIVACY_VERSION:1.0}
    # Idade mínima gravada com a confirmação (o serviço é só para maiores de 18).
    min-age: ${MIN_AGE:18}
    email-verification-enabled: ${EMAIL_VERIFICATION_ENABLED:false}
    profile-photo-enabled: ${PROFILE_PHOTO_ENABLED:false}
    verification-ttl: PT24H
    # Endereço do frontend (links do e-mail e destino do login com Google).
    app-url: ${APP_URL:http://localhost:5173}
    google:
      enabled: ${AUTH_GOOGLE_ENABLED:false}
      client-id: ${AUTH_GOOGLE_CLIENT_ID:}
      client-secret: ${AUTH_GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${AUTH_GOOGLE_REDIRECT_URI:}
